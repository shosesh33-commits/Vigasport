<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VigaSport - Vòng quay may mắn</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #fff4df, #ffe8e8);
  font-family: Arial, sans-serif;
}

.container {
  width: min(92vw, 700px);
  background: #fff;
  border-radius: 24px;
  padding: 28px 22px 24px;
  box-shadow: 0 15px 45px rgba(0,0,0,.12);
  text-align: center;
}

h1 {
  margin: 0;
  color: #ed3345;
  font-size: clamp(28px, 6vw, 48px);
  font-weight: 800;
}

.subtitle {
  margin: 8px 0 18px;
  color: #777;
  font-size: clamp(16px, 3.5vw, 22px);
}

.wheel-wrap {
  position: relative;
  width: min(88vw, 620px);
  aspect-ratio: 1;
  margin: 0 auto 22px;
}

#wheel {
  width: 100%;
  height: 100%;
  display: block;
}

.pointer {
  position: absolute;
  top: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 24px solid transparent;
  border-right: 24px solid transparent;
  border-top: 55px solid #ed3345;
  z-index: 5;
  filter: drop-shadow(0 3px 3px rgba(0,0,0,.2));
}

button {
  width: min(90%, 340px);
  padding: 16px 20px;
  border: none;
  border-radius: 16px;
  background: #ed3345;
  color: white;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(237,51,69,.25);
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#result {
  display: none;
  margin-top: 24px;
  padding: 24px 16px;
  border-radius: 20px;
  background: #fff5c9;
  color: #222;
}

#result .congrats {
  font-size: 20px;
  margin-bottom: 10px;
}

#result .prize {
  color: #ed3345;
  font-size: clamp(28px, 7vw, 40px);
  font-weight: 800;
  margin-bottom: 10px;
}

.note {
  margin-top: 22px;
  color: #888;
  font-size: 15px;
}

@media (max-width: 500px) {
  body {
    padding: 10px;
    align-items: flex-start;
  }

  .container {
    width: 100%;
    margin-top: 8px;
    padding: 24px 12px 20px;
    border-radius: 22px;
  }

  .wheel-wrap {
    width: min(88vw, 500px);
    margin-top: 8px;
    margin-bottom: 18px;
  }

  .pointer {
    border-left-width: 19px;
    border-right-width: 19px;
    border-top-width: 44px;
  }

  button {
    font-size: 18px;
    padding: 15px;
  }

  #result {
    padding: 20px 10px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>🎁 VÒNG QUAY MAY MẮN</h1>

  <div class="subtitle">
    Quay thử vận may – nhận quà ngay!
  </div>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="700" height="700"></canvas>
  </div>

  <button id="spinBtn">🎯 QUAY NGAY</button>

  <div id="result">
    <div class="congrats">🎉 Chúc mừng!</div>
    <div class="prize" id="prizeText"></div>
    <div>Hãy chụp màn hình kết quả để nhận quà.</div>
  </div>

  <div class="note">
    Mỗi thiết bị/trình duyệt chỉ được quay 1 lần.
  </div>

</div>

<script>
const prizes = [
  "Vớ + băng quấn",
  "Túi chống nước",
  "Giày tự chọn",
  "Giày shop chọn"
];

const colors = [
  "#ef2d2d",
  "#35d1d3",
  "#9b4de5",
  "#99e94a"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const spinBtn = document.getElementById("spinBtn");
const result = document.getElementById("result");
const prizeText = document.getElementById("prizeText");

const SIZE = 700;
const CENTER = SIZE / 2;
const RADIUS = 340;

let rotation = 0;
let spinning = false;

const STORAGE_KEY = "vigasport_spin_used_v2";

function drawWheel() {
  ctx.clearRect(0, 0, SIZE, SIZE);

  const slice = Math.PI * 2 / prizes.length;

  for (let i = 0; i < prizes.length; i++) {

    const start = rotation + i * slice;
    const end = start + slice;
    const middle = start + slice / 2;

    // Vẽ ô
    ctx.beginPath();
    ctx.moveTo(CENTER, CENTER);
    ctx.arc(
      CENTER,
      CENTER,
      RADIUS,
      start,
      end
    );
    ctx.closePath();

    ctx.fillStyle = colors[i];
    ctx.fill();

    ctx.lineWidth = 6;
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();

    // ===== CHỮ =====
    ctx.save();

    ctx.translate(CENTER, CENTER);
    ctx.rotate(middle);

    /*
      Nếu chữ nằm ở nửa bên trái,
      xoay 180 độ để chữ luôn đọc đúng.
    */
    if (Math.cos(middle) < 0) {
      ctx.rotate(Math.PI);
    }

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 25px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
      prizes[i],
      RADIUS * 0.62,
      0
    );

    ctx.restore();
  }

  // Vòng tròn giữa
  ctx.beginPath();
  ctx.arc(CENTER, CENTER, 55, 0, Math.PI * 2);
  ctx.fillStyle = "#ed3345";
  ctx.fill();

  ctx.lineWidth = 5;
  ctx.strokeStyle = "#ffffff";
  ctx.stroke();

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 20px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("QUAY", CENTER, CENTER);
}

drawWheel();


function alreadySpun() {
  return localStorage.getItem(STORAGE_KEY) === "1";
}


if (alreadySpun()) {
  spinBtn.disabled = true;
  spinBtn.textContent = "🔒 ĐÃ QUAY";
}


function spin() {

  if (spinning || alreadySpun()) {
    return;
  }

  spinning = true;
  spinBtn.disabled = true;
  spinBtn.textContent = "🎯 ĐANG QUAY...";

  const winner = Math.floor(Math.random() * prizes.length);

  const slice = 360 / prizes.length;

  /*
    Đưa ô trúng thưởng vào vị trí mũi tên phía trên.
  */
  const targetAngle =
    360 * 6 +
    (360 - (winner * slice + slice / 2));

  const startRotation = rotation;
  const targetRotation =
    startRotation + targetAngle * Math.PI / 180;

  const duration = 4500;
  const startTime = performance.now();

  function animate(now) {

    const progress =
      Math.min((now - startTime) / duration, 1);

    // easing
    const ease =
      1 - Math.pow(1 - progress, 4);

    rotation =
      startRotation +
      (targetRotation - startRotation) * ease;

    drawWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {

      spinning = false;

      localStorage.setItem(STORAGE_KEY, "1");

      spinBtn.textContent = "🔒 ĐÃ QUAY";

      prizeText.textContent = prizes[winner];

      result.style.display = "block";
    }
  }

  requestAnimationFrame(animate);
}


spinBtn.addEventListener("click", spin);
</script>

</body>
</html>
