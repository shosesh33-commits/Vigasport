<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VigaSport - Vòng quay may mắn</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#fff4df,#ffe3e8);
  font-family:Arial,sans-serif;
  color:#333;
}

.card{
  width:min(92vw,520px);
  min-height:100vh;
  background:#fff;
  border-radius:24px;
  padding:24px 18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 15px 45px #0002;
}

h1{
  margin:0 0 6px;
  color:#ed3345;
  font-size:30px;
  text-align:center;
}

.sub{
  margin:0 0 14px;
  color:#777;
  font-size:16px;
  text-align:center;
}

.wheel{
  width:min(88vw,430px);
  aspect-ratio:1;
  margin:10px auto 22px;
  position:relative;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:50%;
  filter:drop-shadow(0 7px 12px #0002);
}

.pointer{
  position:absolute;
  z-index:5;
  left:50%;
  top:-2px;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:19px solid transparent;
  border-right:19px solid transparent;
  border-top:42px solid #ed3345;
}

button{
  border:0;
  background:#ed3345;
  color:#fff;
  border-radius:15px;
  padding:15px 30px;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 5px 12px #ed334555;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#result{
  display:none;
  width:100%;
  margin:18px auto 0;
  padding:15px;
  border-radius:14px;
  background:#fff4c7;
  color:#e52e42;
  text-align:center;
}

#result .congrats{
  font-size:18px;
  color:#333;
}

#result b{
  display:block;
  margin-top:5px;
  color:#e52e42;
  font-size:25px;
}

#result .hint{
  display:block;
  margin-top:8px;
  font-size:14px;
  color:#333;
}

.note{
  font-size:13px;
  color:#888;
  margin-top:14px;
  text-align:center;
}

@media(max-width:500px){

  body{
    padding:0;
  }

  .card{
    width:100%;
    min-height:100vh;
    border-radius:0;
    padding:20px 12px;
  }

  h1{
    font-size:30px;
  }

  .sub{
    font-size:16px;
  }

  .wheel{
    width:92vw;
    max-width:430px;
    margin-top:8px;
  }

  button{
    font-size:20px;
    padding:15px 30px;
  }

  #result{
    width:92vw;
    max-width:430px;
  }
}
</style>
</head>

<body>

<div class="card">

  <h1>🎁 VÒNG QUAY MAY MẮN</h1>

  <p class="sub">
    Quay thử vận may – nhận quà ngay!
  </p>

  <div class="wheel">
    <div class="pointer"></div>
    <canvas id="wheel" width="700" height="700"></canvas>
  </div>

  <button id="spin">🎯 QUAY NGAY</button>

  <div id="result"></div>

  <div class="note">
    Mỗi thiết bị/trình duyệt chỉ được quay 1 lần.
  </div>

</div>

<script>

/* =========================
   PHẦN THƯỞNG
========================= */

const prizes = [
  "Vớ + băng quấn",
  "Túi chống nước",
  "Giày tự chọn",
  "Giày shop chọn"
];


/* =========================
   THIẾT LẬP
========================= */

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const btn = document.getElementById("spin");
const result = document.getElementById("result");

const KEY = "vigasport_spin_used_v2";

let rotation = 0;
let busy = false;


/* =========================
   VẼ VÒNG QUAY
========================= */

function draw(){

  const n = prizes.length;
  const s = Math.PI * 2 / n;

  ctx.clearRect(0,0,700,700);

  for(let i=0;i<n;i++){

    const a = rotation + i*s - Math.PI/2;

    /* Vẽ ô */
    ctx.beginPath();

    ctx.moveTo(350,350);

    ctx.arc(
      350,
      350,
      340,
      a,
      a+s
    );

    ctx.closePath();

    const colors = [
      "#ed2f2f",
      "#7ee52a",
      "#2fd3d6",
      "#8f3fe3"
    ];

    ctx.fillStyle = colors[i];

    ctx.fill();

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 5;

    ctx.stroke();


    /* =========================
       VẼ CHỮ
    ========================= */

    ctx.save();

    const mid = a + s/2;

    ctx.translate(350,350);
    ctx.rotate(mid);

    /*
      Đảo chữ ở phía bên trái
      để luôn đọc được bình thường.
    */

    if(Math.cos(mid) < 0){
      ctx.rotate(Math.PI);
    }

    ctx.fillStyle = "#fff";

    ctx.font = "bold 22px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    /*
      Chia chữ dài thành 2 dòng
      để không bị dính nhau.
    */

    let lines = [];

    if(prizes[i] === "Vớ + băng quấn"){
      lines = ["Vớ +", "băng quấn"];
    }
    else if(prizes[i] === "Túi chống nước"){
      lines = ["Túi chống", "nước"];
    }
    else if(prizes[i] === "Giày tự chọn"){
      lines = ["Giày tự", "chọn"];
    }
    else if(prizes[i] === "Giày shop chọn"){
      lines = ["Giày shop", "chọn"];
    }
    else{
      lines = [prizes[i]];
    }

    /*
      Vị trí chữ nằm giữa ô,
      cách tâm vừa đủ.
    */

    if(lines.length === 1){

      ctx.fillText(
        lines[0],
        215,
        0
      );

    }else{

      ctx.fillText(
        lines[0],
        215,
        -14
      );

      ctx.fillText(
        lines[1],
        215,
        14
      );

    }

    ctx.restore();
  }


  /* =========================
     VÒNG TRÒN Ở GIỮA
  ========================= */

  ctx.beginPath();

  ctx.arc(
    350,
    350,
    55,
    0,
    Math.PI*2
  );

  ctx.fillStyle = "#ed3345";

  ctx.fill();


  ctx.fillStyle = "#fff";

  ctx.font = "bold 20px Arial";

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    "QUAY",
    350,
    350
  );
}


/* =========================
   HIỆN KẾT QUẢ
========================= */

function showPrize(prize){

  result.style.display = "block";

  result.innerHTML = `
    <span class="congrats">🎉 Chúc mừng!</span>
    <b>${prize}</b>
    <span class="hint">
      Hãy chụp màn hình kết quả để nhận quà.
    </span>
  `;
}


/* =========================
   QUAY VÒNG QUAY
========================= */

function spin(){

  if(
    busy ||
    localStorage.getItem(KEY) === "1"
  ){
    return;
  }

  busy = true;

  btn.disabled = true;

  result.style.display = "none";


  const n = prizes.length;

  const s = Math.PI*2/n;


  /*
    Chọn ngẫu nhiên phần thưởng.
  */

  const index = Math.floor(
    Math.random()*n
  );


  /*
    Tính chính xác góc để phần thưởng
    được chọn dừng ngay dưới mũi tên.
  */

  const target =
    rotation +
    Math.PI*2*7 -
    index*s -
    s/2;


  const start = rotation;

  const duration = 4500;

  const begin = performance.now();


  function frame(now){

    const t = Math.min(
      1,
      (now-begin)/duration
    );


    /*
      Hiệu ứng giảm tốc.
    */

    const ease =
      1-Math.pow(1-t,4);


    rotation =
      start +
      (target-start)*ease;


    draw();


    if(t<1){

      requestAnimationFrame(frame);

    }else{

      rotation = target;

      draw();

      busy = false;

      /*
        Lưu trạng thái đã quay.
      */

      localStorage.setItem(
        KEY,
        "1"
      );

      btn.disabled = true;

      btn.textContent = "🔒 ĐÃ QUAY";

      showPrize(
        prizes[index]
      );
    }
  }


  requestAnimationFrame(frame);
}


/* =========================
   KIỂM TRA TRẠNG THÁI
========================= */

if(
  localStorage.getItem(KEY) === "1"
){

  btn.disabled = true;

  btn.textContent = "🔒 ĐÃ QUAY";
}


/* =========================
   KHỞI ĐỘNG
========================= */

btn.addEventListener(
  "click",
  spin
);

draw();

</script>

</body>
</html>
