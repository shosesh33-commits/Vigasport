<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vòng Quay May Mắn</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#fff3d6,#ffe0e8);min-height:100vh;color:#222}
.wrap{max-width:560px;margin:auto;padding:24px 16px 40px;text-align:center}
.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 12px 35px #0002}
h1{margin:4px 0 6px;font-size:30px;color:#e63946}.sub{margin:0 0 18px;color:#666}
.wheelbox{position:relative;width:min(88vw,430px);aspect-ratio:1;margin:8px auto 18px}
canvas{width:100%;height:100%;border-radius:50%;filter:drop-shadow(0 8px 10px #0002)}
.pointer{position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:42px solid #e63946;z-index:3;filter:drop-shadow(0 3px 3px #0004)}
button{border:0;border-radius:14px;padding:14px 25px;font-size:18px;font-weight:700;cursor:pointer;background:#e63946;color:#fff;box-shadow:0 6px 15px #e6394655}
button:disabled{opacity:.55;cursor:not-allowed}.result{display:none;margin-top:18px;padding:18px;border-radius:16px;background:#fff5c7;border:2px dashed #f4a261}
.result strong{display:block;font-size:27px;color:#d62828;margin-top:5px}.note{font-size:13px;color:#777;margin-top:18px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin-bottom:12px;font-size:16px}
.admin{margin-top:18px;text-align:left;background:#fafafa;border-radius:14px;padding:14px}.admin summary{cursor:pointer;font-weight:700}
textarea{width:100%;min-height:110px;margin-top:10px;border:1px solid #ddd;border-radius:10px;padding:10px;font:14px Arial}
.smallbtn{font-size:14px;padding:10px 14px;margin-top:8px;background:#333}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🎁 VÒNG QUAY MAY MẮN</h1>
    <p class="sub">Quay thử vận may – nhận quà ngay!</p>
    <input id="customer" placeholder="Tên khách hàng (không bắt buộc)">
    <div class="wheelbox">
      <div class="pointer"></div>
      <canvas id="wheel" width="700" height="700"></canvas>
    </div>
    <button id="spin">🎯 QUAY NGAY</button>
    <div class="result" id="result">
      🎉 Chúc mừng <span id="winner"></span>!
      <strong id="prize"></strong>
      <div style="margin-top:8px">Hãy chụp màn hình kết quả để nhận quà nhé.</div>
    </div>
    <p class="note">Mỗi khách vui lòng quay theo hướng dẫn của shop.</p>

    <details class="admin">
      <summary>⚙️ Cài đặt phần thưởng</summary>
      <p style="font-size:13px;color:#666">Mỗi dòng là một ô trên vòng quay. Có thể thay nội dung rồi bấm “Áp dụng”.</p>
      <textarea id="prizes"></textarea>
      <button class="smallbtn" id="apply">Áp dụng phần thưởng</button>
    </details>
  </div>
</div>

<script>
let prizes = [
  "Giảm 10.000đ","Chúc bạn may mắn","Freeship","Giảm 20.000đ",
  "Quà tặng bất ngờ","Giảm 30.000đ","Chúc bạn may mắn","Voucher 50.000đ"
];

const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d");
const spinBtn=document.getElementById("spin"), result=document.getElementById("result");
const winner=document.getElementById("winner"), prize=document.getElementById("prize");
let rotation=0, spinning=false;

function draw(){
  const n=prizes.length, cx=350, cy=350, r=340, slice=2*Math.PI/n;
  ctx.clearRect(0,0,700,700);
  for(let i=0;i<n;i++){
    const a=rotation+i*slice-Math.PI/2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+slice);ctx.closePath();
    ctx.fillStyle=`hsl(${i*360/n},78%,${i%2?62:54}%)`;ctx.fill();
    ctx.strokeStyle="#fff";ctx.lineWidth=5;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a+slice/2);
    ctx.textAlign="right";ctx.fillStyle="#fff";ctx.font="bold 24px Arial";
    let text=prizes[i]; if(text.length>19) text=text.slice(0,18)+"…";
    ctx.fillText(text,r-22,8);ctx.restore();
  }
  ctx.beginPath();ctx.arc(cx,cy,62,0,2*Math.PI);ctx.fillStyle="#fff";ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,52,0,2*Math.PI);ctx.fillStyle="#e63946";ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold 22px Arial";ctx.textAlign="center";ctx.fillText("QUAY",cx,cy+8);
}
function ease(t){return 1-Math.pow(1-t,4)}
function spin(){
 if(spinning) return;
 spinning=true;spinBtn.disabled=true;result.style.display="none";
 const start=rotation, duration=4800, turns=7+Math.random()*3;
 const target=start+turns*2*Math.PI+Math.random()*2*Math.PI;
 const startTime=performance.now();
 function anim(now){
   const t=Math.min(1,(now-startTime)/duration);
   rotation=start+(target-start)*ease(t); draw();
   if(t<1){requestAnimationFrame(anim)}else{
     rotation=rotation%(2*Math.PI);
     const n=prizes.length, slice=2*Math.PI/n;
     // Pointer is at top (-PI/2). Determine which slice is under it.
     let pos=((Math.PI*1.5-rotation)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
     let idx=Math.floor(pos/slice)%n;
     winner.textContent=document.getElementById("customer").value.trim()||"bạn";
     prize.textContent=prizes[idx];
     result.style.display="block"; spinning=false; spinBtn.disabled=false;
     confetti();
   }
 }
 requestAnimationFrame(anim);
}
function confetti(){
 for(let i=0;i<90;i++){
   const d=document.createElement("div");d.style.position="fixed";d.style.left=(50+Math.random()*20-10)+"%";d.style.top="35%";
   d.style.width="8px";d.style.height="12px";d.style.background=`hsl(${Math.random()*360},90%,55%)`;d.style.zIndex=99;
   document.body.appendChild(d);
   const dx=(Math.random()-0.5)*700, dy=500+Math.random()*400;
   d.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1200+Math.random()*900,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=()=>d.remove();
 }
}
document.getElementById("apply").onclick=()=>{
 const arr=document.getElementById("prizes").value.split("\n").map(x=>x.trim()).filter(Boolean);
 if(arr.length>=2){prizes=arr;draw();alert("Đã cập nhật phần thưởng!");}
 else alert("Cần ít nhất 2 phần thưởng.");
};
document.getElementById("prizes").value=prizes.join("\n");
spinBtn.onclick=spin; draw();
</script>
</body>
</html>
