<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VigaSport - Vòng quay may mắn</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(135deg,#fff4df,#ffe8e8);
  font-family:Arial,sans-serif;
}

.card{
  width:min(92vw,520px);
  background:#fff;
  border-radius:26px;
  padding:28px 20px 25px;
  text-align:center;
  box-shadow:0 15px 45px #0002;
}

h1{
  margin:0 0 8px;
  color:#ed3345;
  font-size:30px;
}

.sub{
  margin:0 0 20px;
  color:#777;
  font-size:16px;
}

.wheel{
  width:min(88vw,430px);
  aspect-ratio:1;
  margin:10px auto 22px;
  position:relative;
}

canvas{
  width:100%;
  height:100%;
  display:block;
  border-radius:50%;
  filter:drop-shadow(0 7px 12px #0002);
}

.pointer{
  position:absolute;
  z-index:5;
  left:50%;
  top:-2px;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:19px solid transparent;
  border-right:19px solid transparent;
  border-top:42px solid #ed3345;
}

button{
  border:0;
  background:#ed3345;
  color:white;
  border-radius:15px;
  padding:14px 30px;
  font-size:20px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 5px 12px #ed334555;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

#result{
  display:none;
  margin:18px auto 0;
  padding:15px;
  border-radius:14px;
  background:#fff4c7;
}

#result b{
  display:block;
  color:#e52e42;
  font-size:25px;
  margin-top:5px;
}

.note{
  font-size:13px;
  color:#888;
  margin-top:14px;
}

@media(max-width:500px){
  body{
    padding:10px;
  }

  .card{
    width:100%;
    padding:24px 12px;
  }

  h1{
    font-size:27px;
  }

  .sub{
    font-size:15px;
  }

  button{
    font-size:18px;
    padding:13px 27px;
  }
}
</style>
</head>

<body>

<div class="card">

  <h1>🎁 VÒNG QUAY MAY MẮN</h1>

  <p class="sub">
    Quay thử vận may – nhận quà ngay!
  </p>

  <div class="wheel">
    <div class="pointer"></div>
    <canvas id="wheel" width="700" height="700"></canvas>
  </div>

  <button id="spin">🎯 QUAY NGAY</button>

  <div id="result"></div>

  <div class="note">
    Mỗi thiết bị/trình duyệt chỉ được quay 1 lần.
  </div>

</div>

<script>

const prizes = [
  "Vớ + băng quấn",
  "Túi chống nước",
  "Giày tự chọn",
  "Giày shop chọn"
];

const colors = [
  "#ed2f2f",
  "#82e927",
  "#2fd1d4",
  "#8e32e5"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const btn = document.getElementById("spin");
const result = document.getElementById("result");

const SIZE = 700;
const CENTER = SIZE / 2;
const RADIUS = 340;

let rotation = 0;
let busy = false;

function drawWheel(){

  ctx.clearRect(0,0,SIZE,SIZE);

  const n = prizes.length;
  const slice = Math.PI * 2 / n;

  for(let i=0;i<n;i++){

    const start = rotation + i * slice;
    const end = start + slice;
    const middle = start + slice / 2;

    /* Ô phần thưởng */
    ctx.beginPath();
    ctx.moveTo(CENTER,CENTER);
    ctx.arc(
      CENTER,
      CENTER,
      RADIUS,
      start,
      end
    );
    ctx.closePath();

    ctx.fillStyle = colors[i];
    ctx.fill();

    /* Viền */
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 5;
    ctx.stroke();

    /*
      ===== CHỮ =====
      Đưa chữ vào chính giữa từng ô
      và tự xuống dòng nếu dài.
    */

    ctx.save();

    ctx.translate(CENTER,CENTER);
    ctx.rotate(middle);

    /*
      Nếu chữ nằm bên trái vòng,
      xoay lại để chữ không bị ngược.
    */
    if(
      Math.cos(middle) < 0
    ){
      ctx.rotate(Math.PI);
    }

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 23px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const text = prizes[i];

    /*
      Tách chữ thành từng dòng.
    */
    let lines = [];

    if(text === "Vớ + băng quấn"){
      lines = ["Vớ +", "băng quấn"];
    }
    else if(text === "Túi chống nước"){
      lines = ["Túi chống", "nước"];
    }
    else if(text === "Giày tự chọn"){
      lines = ["Giày tự", "chọn"];
    }
    else if(text === "Giày shop chọn"){
      lines = ["Giày shop", "chọn"];
    }

    const textRadius = 215;

    if(lines.length === 1){

      ctx.fillText(
        lines[0],
        textRadius,
        0
      );

    }else{

      ctx.fillText(
        lines[0],
        textRadius,
        -15
      );

      ctx.fillText(
        lines[1],
        textRadius,
        15
      );
    }

    ctx.restore();
  }

  /* Nút QUAY ở giữa */
  ctx.beginPath();
  ctx.arc(
    CENTER,
    CENTER,
    55,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#ed3345";
  ctx.fill();

  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 20px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    "QUAY",
    CENTER,
    CENTER
  );
}


function showPrize(prize){

  result.style.display = "block";

  result.innerHTML =
    "🎉 Chúc mừng!<b>" +
    prize +
    "</b><div style='font-size:14px;margin-top:14px'>" +
    "Hãy chụp màn hình kết quả để nhận quà." +
    "</div>";
}


function spin(){

  if(busy) return;

  busy = true;
  btn.disabled = true;
  btn.textContent = "🔒 ĐANG QUAY...";

  const n = prizes.length;
  const slice = Math.PI * 2 / n;

  /*
    Chọn phần thưởng ngẫu nhiên.
  */
  const index = Math.floor(Math.random() * n);

  /*
    Tính góc để phần thưởng được chọn
    dừng đúng dưới mũi tên.
  */
  const target =
    Math.PI * 2 * 5 +
    (Math.PI * 2 - (index + 0.5) * slice);

  const startRotation = rotation;
  const finalRotation = rotation + target;

  const duration = 4500;
  const startTime = performance.now();

  function animate(now){

    const progress =
      Math.min(
        1,
        (now - startTime) / duration
      );

    /*
      Hiệu ứng giảm tốc.
    */
    const ease =
      1 - Math.pow(1 - progress, 4);

    rotation =
      startRotation +
      (finalRotation - startRotation) * ease;

    drawWheel();

    if(progress < 1){

      requestAnimationFrame(animate);

    }else{

      rotation %= Math.PI * 2;

      showPrize(prizes[index]);

      btn.textContent = "🔒 ĐÃ QUAY";

      localStorage.setItem(
        "vigasport_spin_used_v3",
        "1"
      );

      busy = false;
    }
  }

  requestAnimationFrame(animate);
}


/* Kiểm tra đã quay chưa */
if(
  localStorage.getItem(
    "vigasport_spin_used_v3"
  ) === "1"
){

  btn.disabled = true;
  btn.textContent = "🔒 ĐÃ QUAY";
}


/* Nút quay */
btn.addEventListener(
  "click",
  spin
);


/* Vẽ vòng quay lần đầu */
drawWheel();

</script>

</body>
</html>
